[package]
name = "wxmd"
version = "0.1.0"
description = "WeChat-friendly Markdown editor (local, Rust-first)"
edition = "2021"
license = "MIT"

[lib]
name = "wxmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
rfd = "0.15"
notify = "6"
winapi = { version = "0.3", features = ["winuser", "winbase", "winnt", "minwindef"] }

# 静默 PDF 导出：复用系统 WebView2 运行时的 PrintToPdf（仅 Windows，纯离线、不内置浏览器内核）。
# webview2-com / windows 均为 Tauri 既有传递依赖，版本对齐 0.38 / 0.61，不增加分发体积。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
